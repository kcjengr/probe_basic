[EMC]
VERSION = 1.1
MACHINE = QtPyVCP - probe_basic Lathe Sim (Metric)
DEBUG = 0

[DISPLAY]
DISPLAY = probe_basic_lathe
THEME_COLOR = system
BACK_TOOL_LATHE = 1
MASTER_TOOL_OFFSET_MODE = true
CONFIRM_EXIT = False
LOG_FILE = sim_lathe.log
LOG_LEVEL = DEBUG
PREFERENCE_FILE = sim.pref
CONFIG_FILE = custom_config.yml
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
DEFAULT_LINEAR_VELOCITY = 12.700000
MAX_LINEAR_VELOCITY = 84.666684
MIN_LINEAR_VELOCITY = 0.423418
DEFAULT_ANGULAR_VELOCITY = 12.000000
MAX_ANGULAR_VELOCITY = 180.000000
MIN_ANGULAR_VELOCITY = 1.666667
DEFAULT_SPINDLE_SPEED = 300
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.500000
MAX_FEED_OVERRIDE = 2.000000
PROGRAM_PREFIX = ~/linuxcnc/nc_files/
OPEN_FILE = ~/linuxcnc/nc_files/pb_examples/blank.ngc
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 9
INCREMENTS = JOG 1.000 0.100 0.010 0.001
# USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XZ
GEOMETRY = XZ
OFFSET_COLUMNS = XZ
TOOL_TABLE_COLUMNS = TXZIJDQR
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = false

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files

[VTK]
# Safety fallback: force Python backplot path while investigating native crashes.
CPP_BACKPLOT = 0

[RS274NGC]
RS274NGC_STARTUP_CODE = G90 G7 G18 G21 G95 G96D2000S61 G64P0.0025
PARAMETER_FILE = sim-lathe.var
SUBROUTINE_PATH = subroutines
ON_ABORT_COMMAND = O<on_abort> CALL
# ngc=toolchange_manual: safe default for manual tool change (the common
# case) -- falls through to LinuxCNC's own built-in tool-change handling,
# no ATC/carousel hardware assumed. Machines with a REAL automatic tool
# changer should change this to ngc=toolchange (subroutines/toolchange.ngc)
# instead, which implements actual carousel/turret indexing.
REMAP=M6  modalgroup=6 prolog=change_prolog ngc=toolchange_manual epilog=change_epilog

[PYTHON]
PATH_PREPEND = python
TOPLEVEL = python/toplevel.py

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = hallib/core_sim_2.hal
HALFILE = hallib/simulated_home_xz.hal
HALFILE = hallib/simulated_lathe.hal
HALUI = halui
POSTGUI_HALFILE = hallib/probe_basic_lathe_postgui.hal

[HALUI]

[TRAJ]
AXES = 2
SPINDLES = 2
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
DEFAULT_VELOCITY = 25.4
MAX_LINEAR_VELOCITY = 84.666684
DEFAULT_ACCELERATION = 508.0
MAX_ACCELERATION = 508.0
NO_FORCE_HOMING = 0

# Spindle speed ceiling, enforced by task: a commanded speed above
# MAX_FORWARD_VELOCITY is clamped to it rather than refused. Note the sim's
# own hard ceiling is 1250 RPM -- above that the simulated encoder in
# hallib/simulated_lathe.hal cannot emit every quadrature state from the
# 10 kHz base thread (480 counts/rev x RPM/60 = 8 x RPM states/sec vs
# BASE_PERIOD 100000), so counts are lost and spindle feedback goes wrong.
# 1200 sits just under that deliberately. RPM is unit-independent, so this
# matches the inch sim exactly.
[SPINDLE_0]
MAX_FORWARD_VELOCITY = 1200
MIN_FORWARD_VELOCITY = 0
MAX_REVERSE_VELOCITY = 1200
MIN_REVERSE_VELOCITY = 0

[SPINDLE_1]
MAX_FORWARD_VELOCITY = 1200
MIN_FORWARD_VELOCITY = 0
MAX_REVERSE_VELOCITY = 1200
MIN_REVERSE_VELOCITY = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
# TOOL_TABLE ignored when DB_PROGRAM is set (tooldb interface)
#TOOL_TABLE = lathe.tbl
DB_PROGRAM = ./tool_db.sh
TOOL_DB_FILE = lathe_sim_tools_mm.db
#TOOL_CHANGE_POSITION = 2 0 1
#TOOL_CHANGE_WITH_SPINDLE_ON = 1

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

[AXIS_X]
MIN_LIMIT = -127.0
MAX_LIMIT = 127.0
MAX_VELOCITY = 84.666684
MAX_ACCELERATION = 508.0

[JOINT_0]
TYPE =  LINEAR
HOME =  0.000
MAX_VELOCITY = 84.666684
MAX_ACCELERATION = 508.0
BACKLASH = 0.000
INPUT_SCALE = 157.480315
OUTPUT_SCALE = 1.000
MIN_LIMIT = -127.0
MAX_LIMIT = 127.0
FERROR = 1.270
MIN_FERROR = 0.254
HOME_OFFSET = 25.4
HOME_SEARCH_VEL = 127.0
HOME_LATCH_VEL = 25.4
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
HOME_IS_SHARED = 1

[AXIS_Z]
MIN_LIMIT = 0
MAX_LIMIT = 304.8
MAX_VELOCITY = 84.666684
MAX_ACCELERATION = 508.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 84.666684
MAX_ACCELERATION = 508.0
BACKLASH = 0.000
INPUT_SCALE = 157.480315
OUTPUT_SCALE = 1.000
MIN_LIMIT = 0.0
MAX_LIMIT = 304.8
FERROR = 1.270
MIN_FERROR = 0.254
HOME_OFFSET = 25.4
HOME_SEARCH_VEL = 127.0
HOME_LATCH_VEL = 25.4
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1
