name: Release (stable, bookworm)

# Builds and publishes python3-probe-basic for a tagged stable release.
# Replaces the buildbot's probe_basic_pyqt5_{x86,arm64}_factory.py stable
# builders + do_apt_bookworm.sh/do_apt_stable.sh.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts dpkg-dev python3-pip

      - name: Add kcjengr/apt as a build-time package source
        run: |
          echo "deb [trusted=yes] https://raw.githubusercontent.com/kcjengr/apt/main/apt bookworm main" \
            > /etc/apt/sources.list.d/kcjengr.list
          apt-get update

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          fetch-tags: true

      - name: Install package build-deps
        working-directory: source
        run: |
          apt-get build-dep -y .
          # Not packaged for bookworm (only trixie has python3-poetry-dynamic-versioning);
          # pyproject.toml's build-backend needs it regardless of target suite.
          pip install --break-system-packages "poetry-dynamic-versioning>=1.0.0,<2.0.0"

      - name: Create changelog entry
        working-directory: source
        env:
          EMAIL: lcvette1@gmail.com
        run: |
          # Debian versions can't start with a letter -- strip the leading "v".
          VERSION="${GITHUB_REF_NAME#v}"
          dch --create --distribution stable --package probe-basic \
            --newversion "${VERSION}" "Stable version."

      - name: Build package
        working-directory: source
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -b -uc

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: probe-basic-bookworm-${{ matrix.arch }}
          path: '*.deb'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: probe-basic-bookworm-*
          path: debs
          merge-multiple: true

      - name: Checkout apt repo
        uses: actions/checkout@v4
        with:
          repository: kcjengr/apt
          path: apt-repo
          token: ${{ secrets.APT_REPO_TOKEN }}

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Copy packages into pool
        run: |
          mkdir -p apt-repo/apt/pool/main/bookworm
          cp debs/*.deb apt-repo/apt/pool/main/bookworm/

      - name: Publish bookworm + stable suites
        working-directory: apt-repo
        env:
          GPG_KEY_ID: 2DEC041F290DF85A
        run: |
          ./scripts/publish-suite.sh bookworm bookworm amd64 arm64
          ./scripts/publish-suite.sh stable   bookworm amd64 arm64

      - name: Commit and push
        working-directory: apt-repo
        run: |
          set -euo pipefail
          git config user.name "kcjengr-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "Publish probe-basic ${GITHUB_REF_NAME} (bookworm/stable)"
          git push
